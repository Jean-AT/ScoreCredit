services:
  db:
    image: postgres:16-alpine
    container_name: bodegascore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bodegascore
    ports:
      - '5433:5432'
    volumes:
      - bodegascore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bodegascore']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  bodegascore_pgdata:
